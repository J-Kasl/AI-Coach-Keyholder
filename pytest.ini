[pytest]
# Ensures top-level packages (infrastructure, database, core, ...) are
# importable regardless of the directory pytest is invoked from —
# equivalent to running with the project root on PYTHONPATH.
pythonpath = .

testpaths = tests

# Fail on unknown markers / import errors surfacing as collection
# errors rather than silently skipped files — a documentation set this
# precise about invariants should have a test suite that fails loudly.
addopts = --strict-markers -ra
